[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-to-text-in-focus"
version = "0.1.0"
description = "Voice dictation for Windows with Whisper (local or OpenAI API): global hotkey and text injection at the cursor."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "YeuKo" }]
keywords = ["speech-to-text", "dictation", "whisper", "transcription", "windows", "voice"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# Core dependencies (transcription and audio).
# Windows-specific ones (hotkeys, clipboard, tray) live in the [windows] extra.
dependencies = [
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "openai>=1.30",
    "rapidfuzz>=3.6",
]

[project.optional-dependencies]
# Install on native Windows:  pip install -e ".[windows]"
windows = [
    "keyboard>=0.13.5",     # global hotkeys
    "pyperclip>=1.8.2",     # clipboard
    "pystray>=0.19",        # tray icon
    "Pillow>=10.0",         # icons for pystray
    "keyring>=24.0",        # store the API key securely
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
# Build the portable release:  pip install -e ".[windows,build]" && python scripts/build.py
build = [
    "pyinstaller>=6.6",
]

[project.urls]
Homepage = "https://github.com/YeuKo/speech-to-text-in-focus"
Repository = "https://github.com/YeuKo/speech-to-text-in-focus"
Issues = "https://github.com/YeuKo/speech-to-text-in-focus/issues"

[project.scripts]
stt = "stt.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Pinned explicitly: ruff's default rule set grows between releases, and CI must
# not start failing because a newer version decided to check something else.
[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
