# Speech to Text in Focus configuration.
# Copy this file to "config.toml" and adjust it. config.toml is in .gitignore.

[engine]
# Transcription backend: "local" (faster-whisper) or "openai" (API).
backend = "local"
# Audio language as ISO-639-1 ("en", "es", ...) or "auto" to autodetect.
language = "en"

[local]
# faster-whisper model. "auto" picks one based on the detected hardware:
#   - with a CUDA GPU -> large-v3-turbo
#   - CPU only        -> small
# Valid values: tiny, base, small, medium, large-v3, large-v3-turbo,
#               distil-large-v3, distil-small.en, ... or "auto".
model = "auto"
# Device: "auto" (detect GPU), "cuda" or "cpu".
device = "auto"
# Compute precision: "auto", "int8", "int8_float16", "float16", "float32".
compute_type = "auto"

[openai]
# API model: "gpt-4o-transcribe", "gpt-4o-mini-transcribe" or "whisper-1".
model = "gpt-4o-transcribe"
# Name of the environment variable holding the API key (do NOT put the key here).
# To store it securely without touching this file: "stt --set-api-key".
api_key_env = "OPENAI_API_KEY"
# Trim silence before sending to the API. The API bills by audio duration
# (silence included), so this makes dictation with long pauses cheaper.
trim_silence = true

[hotkey]
# Separate global shortcuts per mode. Syntax of the "keyboard" library.
# The tray menu ("Change shortcut") offers a list of ready-made combinations,
# including ctrl+shift+z and ctrl+shift+x for either mode.
toggle = "ctrl+alt+space"      # press to start / stop (or auto-stop on silence)
push_to_talk = "ctrl+alt+v"    # hold while speaking
# Default mode for a generic activation: "toggle" or "push_to_talk".
default_mode = "toggle"

[feedback]
# How the app reports what it is doing. Also changeable from the tray menu
# ("Feedback"); changes made there are written back to this file.
#   "system" -> Windows' own speech cues from %WINDIR%\Media: soft and they
#               follow the volume mixer (recommended)
#   "beeps"  -> synthesized tones: loud and impossible to miss
#   "off"    -> silent; the tray icon is the only indicator
sound = "system"
# Small floating pill ("Recording", "Transcribing", "Done") that fades on its own.
# Silent and leaves no trace, so it is the default way of knowing what is going on
# — set sound = "off" and keep just this if you prefer. Native Windows
# notifications were tried and removed: they pile up in the Action Center.
overlay = true
# Corner it appears in, taskbar excluded: "bottom-right" (next to the tray),
# "bottom-left", "top-right" or "top-left".
overlay_position = "bottom-right"

[audio]
sample_rate = 16000            # Whisper works at 16 kHz
channels = 1
# Which microphone to record from. "auto" follows the Windows default — which is
# often NOT the one you talk into (a headset left plugged in wins over the laptop
# array). Put part of a device name here, list them with "stt --list-devices", or
# pick one from the tray menu -> Microphone.
input_device = "auto"
# Input gain applied while recording. Raise it if you have to lean into the
# microphone to be heard: it also makes speech detection more sensitive, since
# that is what decides when you started talking. "stt --calibrate-mic" measures
# your voice and suggests a value.
gain = 1.0
# Even out the volume before transcribing, so speech from across the room reaches
# the model as loudly as speech into the microphone. This is what a browser's
# automatic gain control does for a web app, and Whisper transcribes better for it.
auto_gain = true
# Silence time (ms) after which recording auto-stops in toggle mode.
silence_timeout_ms = 1500
# Use VAD (voice-activity detection) to trim silence.
use_vad = true
# Adaptive threshold: measure background noise and adjust the cut automatically.
# Recommended: adapts on its own to any microphone and environment, no calibration.
auto_threshold = true
# Fixed threshold (RMS, 0-1), used ONLY when auto_threshold = false.
# To tune it manually: "stt --calibrate-mic".
silence_threshold = 0.006

[injection]
# How to insert text into the focused window: "clipboard" (Ctrl+V) or "type".
method = "clipboard"
# Restore the previous clipboard contents after pasting.
restore_clipboard = true
# Delay (ms) before pasting, to let the window regain focus.
paste_delay_ms = 80

[dictionary]
# Names passed to Whisper as context so it spells them your way: clients, people,
# products, jargon. Editable from the tray menu → "Custom words…".
# It is a hint, not a rule: keep it to a dozen or so terms, since a long list
# dilutes the effect (Whisper only reads ~224 tokens of context).
terms = ["Anthropic", "Kubernetes", "Grafana"]
# Also correct words that merely *resemble* a term (needs rapidfuzz, already a
# dependency). Catches names the model spelled phonetically ("iber drola"), at the
# risk of rewriting an ordinary word that happens to look like one of your terms.
fuzzy = false

# Exact/fuzzy replacements applied after transcription ("wrong" = "right").
[dictionary.replacements]
"anthropik" = "Anthropic"
"cubernetes" = "Kubernetes"

[usage]
# Record the estimated cost of each API transcription (openai backend only).
track = true
# CSV file accumulating the history (timestamp, model, seconds, cost).
file = "logs/usage.csv"

# Estimated rate in USD per minute of audio, per model. Adjust if OpenAI changes
# pricing. The displayed cost is an estimate, not the exact billed amount.
[usage.price_per_min]
"gpt-4o-transcribe" = 0.006
"gpt-4o-mini-transcribe" = 0.003
"whisper-1" = 0.006

[logging]
# Level: DEBUG, INFO, WARNING, ERROR.
level = "INFO"
# Folder where logs are written (relative to the working directory).
dir = "logs"
